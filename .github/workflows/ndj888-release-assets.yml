name: ndj888 release assets

# Build and test the core plus PHP/Python modules, then package Linux amd64 assets.
# PRs targeting master validate the merge ref; published releases and manual runs
# build the selected tag and attach assets to its existing GitHub Release.
# Both jobs are restricted to ndj888/unit so upstream and other forks stay idle.
on:
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (version or version-N)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'ndj888/unit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Install checkout prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          # An empty ref keeps checkout's default PR merge ref.
          ref: ${{ github.event_name != 'pull_request' && format('refs/tags/{0}', github.event.release.tag_name || inputs.tag) || '' }}
          persist-credentials: false

      - name: Install build and test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends \
            build-essential libssl-dev libpcre2-dev zlib1g-dev libzstd-dev \
            libbrotli-dev php-dev libphp-embed php-cli python3-dev python3-venv \
            ca-certificates git procps openssl

      - name: Build, test, and package
        env:
          CHECKOUT_COMMIT: ${{ steps.checkout.outputs.commit }}
          BUILD_TAG: ${{ github.event.release.tag_name || inputs.tag || '' }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ ! "$CHECKOUT_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Checkout must report a full 40-character commit SHA.\n' >&2
            exit 1
          fi
          # Container steps can use a different HOME from checkout's safe.directory setup.
          # Trust only this workspace for this command; keep Git failure separate from printf.
          git_commit="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse --verify 'HEAD^{commit}')"
          if [[ ! "$git_commit" =~ ^[0-9a-f]{40}$ || "$git_commit" != "$CHECKOUT_COMMIT" ]]; then
            printf 'Git HEAD must be a full SHA matching the checkout commit.\n' >&2
            exit 1
          fi
          . ./version
          version="$NXT_VERSION"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            package_version="$version"
            build_identity="pull-request-${PR_NUMBER}"
          else
            valid_tag=false
            if [[ "$BUILD_TAG" == "$version" ]]; then
              valid_tag=true
            elif [[ "$BUILD_TAG" == "$version"-* ]]; then
              suffix="${BUILD_TAG#"$version"-}"
              if [[ "$suffix" =~ ^[0-9]+$ ]]; then
                valid_tag=true
              fi
            fi
            if [[ "$valid_tag" != true ]]; then
              printf 'Tag %s must equal %s or %s-N (digits only).\n' \
                "$BUILD_TAG" "$version" "$version" >&2
              exit 1
            fi
            package_version="$BUILD_TAG"
            build_identity="$BUILD_TAG"
          fi

          # Debian's embed library can live under a versioned PHP directory.
          mapfile -t php_libraries < <(find /usr/lib -name libphp.so \( -type f -o -type l \))
          if [[ "${#php_libraries[@]}" -ne 1 || ! -f "${php_libraries[0]}" ]]; then
            printf 'Expected one installed libphp.so under /usr/lib.\n' >&2
            printf '%s\n' "${php_libraries[@]}" >&2
            exit 1
          fi
          php_lib_dir="$(readlink -f "$(dirname "${php_libraries[0]}")")"
          test -f "$php_lib_dir/libphp.so"

          core_configure=(./configure --prefix=/usr --statedir=/var/lib/unit
            --control=unix:/var/run/control.unit.sock --runstatedir=/var/run
            --pid=/var/run/unit.pid --logdir=/var/log/unit --log=/var/log/unit/unit.log
            --tmpdir=/var/tmp --user=unit --group=unit --modulesdir=/usr/lib/unit/modules
            --openssl --zlib --zstd --brotli)
          php_configure=(./configure php --module=php --config=php-config "--lib-path=$php_lib_dir")
          python_configure=(./configure python --config=python3-config)
          "${core_configure[@]}"
          "${php_configure[@]}"
          "${python_configure[@]}"
          make -j "$(nproc)"
          make -j "$(nproc)" php python3

          version_output="$(build/sbin/unitd --version 2>&1)"
          version_line="${version_output%%$'\n'*}"
          if [[ "$version_line" != "unit version: $version" ]]; then
            printf 'Unexpected built daemon version: %s\n' "$version_line" >&2
            exit 1
          fi
          test -f build/lib/unit/modules/php.unit.so
          test -f build/lib/unit/modules/python3.unit.so

          python3 -m venv /tmp/unit-test-venv
          /tmp/unit-test-venv/bin/python -m pip install -r test/requirements.txt
          # Daemon/router credentials retain --group=unit after --user=nobody.
          # Apps without an explicit group use nobody's own primary group.
          getent group unit > /dev/null || groupadd --system unit
          # Run as root so the daemon can switch to nobody; --print-log aids diagnosis.
          /tmp/unit-test-venv/bin/python -m pytest --user=nobody --restart --print-log \
            test/test_php_application.py test/test_python_application.py

          package="unit-${package_version}-linux-amd64"
          staging="$(mktemp -d)"
          package_dir="$staging/$package"
          mkdir -p "$package_dir"/{sbin,modules,man,include} dist
          cp build/sbin/unitd "$package_dir/sbin/"
          cp build/lib/unit/modules/*.unit.so "$package_dir/modules/"
          cp build/share/man/man8/unitd.8 "$package_dir/man/"
          cp build/include/nxt_version.h "$package_dir/include/"
          cp LICENSE NOTICE CHANGES "$package_dir/"
          {
            printf 'Tag: %s\n' "$build_identity"
            printf 'Commit: %s\n' "$CHECKOUT_COMMIT"
            printf 'Built at (UTC): %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'Base image: debian:trixie\n'
            gcc --version | sed -n '1p'
            printf 'Core configure: '; printf '%q ' "${core_configure[@]}"; printf '\n'
            printf 'PHP configure: '; printf '%q ' "${php_configure[@]}"; printf '\n'
            printf 'Python configure: '; printf '%q ' "${python_configure[@]}"; printf '\n'
            php --version
            python3 --version
            openssl version
          } > "$package_dir/BUILDINFO"
          tar -C "$staging" -czf "dist/$package.tar.gz" "$package"
          (
            cd dist
            sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
            sha256sum --check "$package.tar.gz.sha256"
          )
          rm -rf "$staging"

      - name: Upload tested assets as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ndj888-release-assets
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  upload:
    if: github.repository == 'ndj888/unit' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ndj888-release-assets
          path: dist

      - name: Attach assets to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$BUILD_TAG" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY"
